<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with padding -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(250,204,21,0.25)" stroke-width="4"/>

  <!-- Camera Body Silhouette -->
  <path d="M140 180 L180 140 L332 140 L372 180 L420 180 C436 180 450 194 450 210 L450 390 C450 406 436 420 420 420 L92 420 C76 420 62 406 62 390 L62 210 C62 194 76 180 92 180 Z" fill="#27272a" stroke="#3f3f46" stroke-width="6"/>

  <!-- Top dial / flash -->
  <rect x="110" y="160" width="40" height="20" rx="4" fill="url(#amberGrad)"/>
  <circle cx="390" cy="215" r="14" fill="#ef4444"/>

  <!-- Outer Optical Zoom Ring -->
  <circle cx="256" cy="300" r="110" fill="#18181b" stroke="url(#amberGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Stepped Zoom Ridges -->
  <circle cx="256" cy="300" r="92" fill="none" stroke="#52525b" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="256" cy="300" r="82" fill="url(#lensGrad)"/>

  <!-- Glass Lens Reflection -->
  <ellipse cx="230" cy="275" rx="36" ry="18" fill="rgba(255,255,255,0.45)" transform="rotate(-30 230 275)"/>
  <circle cx="256" cy="300" r="42" fill="#020617"/>
  <circle cx="256" cy="300" r="12" fill="#38bdf8"/>

  <!-- Reticle Crosshairs -->
  <line x1="256" y1="165" x2="256" y2="185" stroke="#facc15" stroke-width="4"/>
  <line x1="256" y1="415" x2="256" y2="435" stroke="#facc15" stroke-width="4"/>
  <line x1="120" y1="300" x2="140" y2="300" stroke="#facc15" stroke-width="4"/>
  <line x1="372" y1="300" x2="392" y2="300" stroke="#facc15" stroke-width="4"/>

  <!-- Zoom Text Kicker -->
  <text x="256" y="105" fill="#facc15" font-family="monospace" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="4">OPTICAM</text>
  <text x="256" y="475" fill="#94a3b8" font-family="monospace" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">10X ZOOM</text>
</svg>
